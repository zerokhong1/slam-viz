<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SLAM Research Visualizations</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #06090f; }
    </style>
    <script type="module" crossorigin src="/slam-viz/assets/index.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <div id="load-fallback" style="display:none;position:fixed;inset:0;background:#06090f;color:#ffb347;font-family:monospace;align-items:center;justify-content:center;text-align:center;flex-direction:column;gap:12px">
      <div style="font-size:18px">Page failed to load</div>
      <div style="font-size:13px;color:#8899ad">Browser cache may be outdated</div>
      <button onclick="location.reload(true)" style="margin-top:8px;background:transparent;border:1px solid #ffb347;color:#ffb347;padding:8px 20px;border-radius:6px;cursor:pointer;font-size:13px;font-family:monospace">Refresh Page</button>
    </div>
    <script>
      setTimeout(function() {
        if (!document.getElementById('root').hasChildNodes()) {
          document.getElementById('load-fallback').style.display = 'flex';
        }
      }, 8000);
    </script>
  </body>
</html>
